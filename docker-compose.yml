services:
  findash-lvo:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_APP_ID: ${VITE_APP_ID}
        VITE_OAUTH_PORTAL_URL: ${VITE_OAUTH_PORTAL_URL}
    image: findash-lvo:latest
    container_name: findash-lvo
    restart: unless-stopped
    env_file:
      - .env
    ports:
      # APP_PORT é a porta externa fixa; 3000 é a porta interna do Node.
      - "${APP_PORT:-3002}:3000"
