services:
  findash-lvo:
    build:
      context: .
      dockerfile: Dockerfile
    image: findash-lvo:latest
    container_name: findash-lvo
    restart: unless-stopped
    env_file:
      - .env
    ports:
      # APP_PORT é a porta externa; 3000 é a porta interna do Node.
      # Use APP_PORT=0 para o Docker escolher uma porta livre automaticamente.
      - "${APP_PORT:-0}:3000"
